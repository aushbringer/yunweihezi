[package]
name = "openterm"
version = "1.0.13"
description = "OpenTerm - cross-platform ops terminal (SSH/SFTP/Serial/Telnet)"
authors = ["OpenTerm Contributors"]
edition = "2021"

[lib]
name = "openterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"

tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"

# SSH / SFTP
russh = "=0.65.0"
russh-sftp = "=3.0.1"
ssh-key = "0.6"

# Serial / local shell / modem / ftp
serialport = "4.10"
portable-pty = "0.9"
zmodem2 = "0.4"
suppaftp = { version = "12", features = ["tokio"] }

# Crypto / storage
argon2 = "0.6"
aes-gcm = "0.11"
rand = "0.9"
zeroize = { version = "1", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }

# Utils
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[features]
default = []
python = ["dep:pyo3"]

[dependencies.pyo3]
version = "0.30"
features = ["auto-initialize", "abi3-py39"]
optional = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
